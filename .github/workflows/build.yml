name: Build JellyHome APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          if [ -f JellyHome.zip ]; then
            unzip -q -o JellyHome.zip -d /tmp/src
            cd /tmp/src/JellyHome
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/JellyHome.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JellyHome-apk
          path: JellyHome.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JellyHome.apk --title "JellyHome (latest build)" --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
