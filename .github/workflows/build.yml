name: Build JellyHome APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          echo "Files in the repository:"; find . -path ./.git -prune -o -type f -print | head -40
          GW=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$GW" ]; then
            ZIP=$(find . -iname '*.zip' -not -path './.git/*' | head -1)
            if [ -z "$ZIP" ]; then echo "::error::No zip file found. Upload JellyHome.zip from the chat."; exit 1; fi
            echo "Unpacking $ZIP"
            unzip -q -o "$ZIP" -d /tmp/src
            GW=$(find /tmp/src -name gradlew | head -1)
          fi
          if [ -z "$GW" ]; then echo "::error::The zip doesn't contain the JellyHome project."; exit 1; fi
          cd "$(dirname "$GW")"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/JellyHome.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JellyHome-apk
          path: JellyHome.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JellyHome.apk --title "JellyHome (latest build)" --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
