<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JellyHome</title>
<style>
:root{--bg:#0b0d12;--fg:#f2f4f8;--dim:#9aa3b2;--accent:#00a4dc;--card:#1a1f2b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--fg);
  font-family:"Amazon Ember",Roboto,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}

/* backdrop + trailer */
.bd{background:#111 center/cover no-repeat;opacity:0;transition:opacity .7s}
#dim{background:rgba(5,6,9,.82);opacity:0;transition:opacity .45s}
#trailer{opacity:0;transition:opacity .8s,left .45s,top .45s,width .45s,height .45s}
#trailer video,#trailer iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;object-fit:cover;pointer-events:none;background:#000}
.trailer-on #trailer{opacity:1}
#shade{background:
  linear-gradient(0deg,var(--bg) 0,rgba(11,13,18,.92) 40%,rgba(11,13,18,0) 68%),
  linear-gradient(90deg,rgba(11,13,18,.95) 0,rgba(11,13,18,.65) 34%,rgba(11,13,18,0) 62%);transition:opacity .8s}

/* top bar */
#top{position:absolute;right:96px;top:48px;display:flex;align-items:center;gap:20px;font-size:34px;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#dot{width:14px;height:14px;border-radius:50%;background:#666}
#dot.ok{background:#3ccf7a}#dot.bad{background:#e5484d}

/* hero text */
#hero{position:absolute;left:96px;top:120px;width:860px;transition:opacity .6s}
#heroTitle{font-size:68px;font-weight:700;line-height:1.05;min-height:80px;display:flex;align-items:flex-end}
#heroTitle img{max-height:150px;max-width:620px;object-fit:contain;object-position:left bottom}
#heroSub{font-size:30px;font-weight:600;margin-top:14px;color:#dfe3ea}
#heroMeta{font-size:26px;color:var(--dim);margin-top:12px}
#heroMeta span+span:before{content:"·";margin:0 12px;color:#5c6575}
#heroOverview{font-size:26px;line-height:1.45;margin-top:16px;color:#d4d9e1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .6s}
#heroHint{font-size:22px;color:var(--dim);margin-top:18px;transition:opacity .6s}
.trailer-on #heroOverview{opacity:0}
.trailer-on #heroHint{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.trailer-on #shade{opacity:.75}

/* rows */
#rows{position:absolute;left:0;right:0;top:590px;bottom:0;overflow:hidden}
#rowsInner{transition:transform .3s ease}
.row{padding:0 0 22px 96px}
.row h2{font-size:30px;font-weight:600;color:var(--dim);margin-bottom:6px;transition:color .2s}
.row.cur h2{color:var(--fg)}
.track{display:flex;padding:16px 0 20px;transition:transform .3s ease}
.card{flex:none;position:relative;margin-right:26px;border-radius:12px;overflow:hidden;background:var(--card);transition:transform .2s,box-shadow .2s;cursor:pointer}
.card.poster{width:200px;height:300px}
.card.wide{width:384px;height:216px}
.card.app{width:288px;height:162px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b2130}
.card>img{width:100%;height:100%;object-fit:cover;display:block}
.card.focus{transform:scale(1.08);box-shadow:0 0 0 5px #fff,0 18px 40px rgba(0,0,0,.65);z-index:2}
.ph{display:flex;align-items:flex-end;padding:18px;font-size:24px;font-weight:700;line-height:1.2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));font-size:20px;line-height:1.3}
.cap b{display:block;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{color:#c8ced8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:var(--accent)}
.check,.count{position:absolute;right:10px;top:10px;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.appic{width:84px;height:84px;object-fit:contain;border-radius:18px}
.appic.sym{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08)}
.appic.sym svg{width:52px;height:52px;fill:#fff}
.appic.letter{display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.card.app .lbl{margin-top:12px;font-size:22px;color:#dfe3ea;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.app.banner .lbl{display:none}

/* overlays */
.ov{display:none;position:absolute;z-index:10}
.ov.open{display:block}
#menu{right:0;top:0;bottom:0;width:680px;background:rgba(14,17,24,.97);padding:110px 64px;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
#menu h3{font-size:40px;line-height:1.15;margin-bottom:10px}
#menu p{font-size:24px;color:var(--dim);margin-bottom:40px}
.opt{font-size:30px;padding:20px 28px;border-radius:12px;margin-bottom:8px;color:#dfe3ea;cursor:pointer}
.f.focus{background:#fff;color:#0b0d12}
#settings,#picker{left:0;top:0;width:100%;height:100%;background:rgba(8,10,14,.97)}
.panel{position:absolute;left:50%;top:70px;bottom:70px;width:980px;margin-left:-490px;display:flex;flex-direction:column}
.panel h1{font-size:48px;margin-bottom:8px}
.panel .sub{font-size:24px;color:var(--dim);margin-bottom:28px}
.scroll{position:relative;flex:1;overflow:hidden}
.lab{font-size:22px;color:var(--dim);margin:14px 0 8px 4px}
input.f{display:block;width:100%;font:inherit;font-size:30px;color:#fff;background:#1b2130;border:4px solid transparent;border-radius:12px;padding:16px 20px;outline:none}
input.f.focus{background:#1b2130;color:#fff;border-color:#fff}
#sstatus{font-size:24px;min-height:34px;margin:14px 4px;color:#ffcf5c}
.prow{display:flex;align-items:center;gap:24px;font-size:28px;padding:12px 20px;border-radius:12px;margin-bottom:6px;cursor:pointer}
.prow img{width:64px;height:64px;object-fit:contain;border-radius:12px}
.prow img.bn{width:114px}
.prow .nm{flex:1}
.prow .pos{font-size:24px;font-weight:700;color:var(--accent)}
.prow.focus .pos{color:#0b6e95}

/* big trailer view: 90% of the height */
#rows,#top{transition:opacity .4s}
.big #dim{opacity:1}
.big #trailer{left:96px;top:0;width:1728px;height:972px}
.big #trailer video{object-fit:contain}
.big #shade,.big #hero,.big #rows,.big #top{opacity:0;pointer-events:none}
#bigbar{position:absolute;left:96px;right:96px;top:972px;height:108px;display:flex;align-items:center;justify-content:space-between;opacity:0;transition:opacity .4s;pointer-events:none}
.big #bigbar{opacity:1}
#bigTitle{font-size:34px;font-weight:700}
#bigTitle span{font-weight:400;color:var(--dim);margin-left:16px}
#bigMsg{font-size:24px;color:var(--dim);white-space:pre}

#toast{position:absolute;left:50%;bottom:60px;transform:translate(-50%,40px);background:rgba(30,35,48,.96);padding:18px 34px;border-radius:40px;font-size:26px;opacity:0;transition:all .3s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage">
  <div id="bd0" class="fill bd"></div>
  <div id="bd1" class="fill bd"></div>
  <div id="dim" class="fill"></div>
  <div id="trailer" class="fill"></div>
  <div id="shade" class="fill"></div>
  <div id="top"><div id="dot"></div><div id="clock"></div></div>
  <div id="hero">
    <div id="heroTitle"></div>
    <div id="heroSub"></div>
    <div id="heroMeta"></div>
    <div id="heroOverview"></div>
    <div id="heroHint"></div>
  </div>
  <div id="rows"><div id="rowsInner"></div></div>

  <div id="menu" class="ov"><h3></h3><p></p><div class="opts"></div></div>
  <div id="settings" class="ov"><div class="panel"><h1>Home screen settings</h1><div class="sub">Connect to your Jellyfin server and choose what shows on your home screen.</div><div class="scroll"></div></div></div>
  <div id="picker" class="ov"><div class="panel"><h1>Choose your apps</h1><div class="sub">OK adds or removes an app. ◀ ▶ moves a chosen app earlier or later. Back saves.</div><div class="scroll"></div></div></div>
  <div id="bigbar"><div id="bigTitle"></div><div id="bigMsg"></div></div>
  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';
  var B = window.Android || null;          // native bridge (only inside the Fire TV app)
  var JELLYFIN_PKG = 'org.jellyfin.androidtv';
  function $(s) { return document.querySelector(s); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function hue(s) { var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function grad(name) { var h = hue(name); return 'linear-gradient(135deg,hsl(' + h + ',45%,30%),hsl(' + ((h + 50) % 360) + ',55%,12%))'; }

  // ---------- settings storage ----------
  function sget(k, d) { try { var v = localStorage.getItem('jh.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function sset(k, v) { try { localStorage.setItem('jh.' + k, JSON.stringify(v)); } catch (e) {} }
  var cfg = Object.assign({ server: '', userId: '', token: '', userName: '', sound: true, delay: 3, apps: null, demo: false }, sget('cfg', {}));
  function save() { sset('cfg', cfg); }
  if (/[?&]demo\b/.test(location.search) && !cfg.token) cfg.demo = true;   // open index.html?demo in a browser to preview
  var deviceId = sget('deviceId', null);
  if (!deviceId) { deviceId = 'jh' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); sset('deviceId', deviceId); }

  // ---------- layout ----------
  // Size of the visible screen in CSS pixels. Inside the app, ask Android directly:
  // the WebView can report a wrong size while it is still starting up.
  function viewport() {
    var w = 0, h = 0;
    if (B && B.screenSize) { try { var s = String(B.screenSize()).split('x'); w = +s[0]; h = +s[1]; } catch (e) {} }
    if (!(w > 0 && h > 0)) {
      var de = document.documentElement;
      w = Math.min(innerWidth || 1e9, de.clientWidth || 1e9);
      h = Math.min(innerHeight || 1e9, de.clientHeight || 1e9);
      if (w === 1e9) w = 1920; if (h === 1e9) h = 1080;
    }
    return [w, h];
  }
  function fit() {
    var v = viewport(), innerWidth = v[0], innerHeight = v[1];
    var s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('#stage');
    st.style.transform = 'scale(' + s + ')';
    st.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
    st.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
  }
  function clock() { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 3200); }
  function setDot(state) { $('#dot').className = state || ''; }

  // ---------- Jellyfin API ----------
  function authHeader(noToken) {
    var h = 'MediaBrowser Client="JellyHome", Device="Fire TV", DeviceId="' + deviceId + '", Version="1.0.0"';
    if (cfg.token && !noToken) h += ', Token="' + cfg.token + '"';
    return h;
  }
  function api(path, method) {
    return fetch(cfg.server + path, { method: method || 'GET', headers: { 'Authorization': authHeader(), 'Content-Type': 'application/json' } })
      .then(function (r) { if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; } return r.text(); })
      .then(function (t) { return t ? JSON.parse(t) : null; });
  }
  // Newer Jellyfin (10.9+) moved some routes; try the new one, fall back to the old one on 404.
  function apiTry(paths, method) {
    var i = 0;
    function next() { return api(paths[i], method).catch(function (e) { i++; if ((e.status === 404 || e.status === 405) && i < paths.length) return next(); throw e; }); }
    return next();
  }
  function normServer(s) {
    s = String(s || '').trim().replace(/\/+$/, '');
    if (!s) return '';
    var hadScheme = /^https?:\/\//i.test(s);
    if (!hadScheme) s = 'http://' + s;
    if (!hadScheme && !/:\d+(\/|$)/.test(s.replace(/^https?:\/\//, ''))) s += ':8096';
    return s;
  }

  var FIELDS = 'Overview,Genres,ProductionYear,OfficialRating,CommunityRating,RunTimeTicks,RemoteTrailers,ChildCount';
  var Q = '&Fields=' + FIELDS + '&EnableImageTypes=Primary,Backdrop,Thumb,Logo&ImageTypeLimit=1&EnableUserData=true';
  function rowDefs() {
    var u = cfg.userId;
    function items(qs) { return ['/Items?userId=' + u + '&Recursive=true' + qs + Q, '/Users/' + u + '/Items?Recursive=true' + qs + Q]; }
    return [
      { title: 'Continue Watching', kind: 'wide', paths: ['/UserItems/Resume?userId=' + u + '&Limit=24&MediaTypes=Video' + Q, '/Users/' + u + '/Items/Resume?Limit=24&MediaTypes=Video' + Q] },
      { title: 'Next Up', kind: 'wide', paths: ['/Shows/NextUp?UserId=' + u + '&Limit=24' + Q] },
      { title: 'Recently Added Movies', kind: 'poster', paths: ['/Items/Latest?userId=' + u + '&IncludeItemTypes=Movie&Limit=30' + Q, '/Users/' + u + '/Items/Latest?IncludeItemTypes=Movie&Limit=30' + Q] },
      { title: 'Shows With New Episodes', kind: 'poster', paths: items('&IncludeItemTypes=Series&SortBy=DateLastContentAdded&SortOrder=Descending&Limit=30') },
      { title: "Movies You Haven't Seen", kind: 'poster', paths: items('&IncludeItemTypes=Movie&Filters=IsUnplayed&SortBy=Random&Limit=30') },
      { title: 'Shows to Start', kind: 'poster', paths: items('&IncludeItemTypes=Series&Filters=IsUnplayed&SortBy=Random&Limit=30') }
    ];
  }
  function norm(r) { return Array.isArray(r) ? r : ((r && r.Items) || []); }

  // ---------- image URLs ----------
  function img(id, type, tag, q) { return cfg.server + '/Items/' + id + '/Images/' + type + '?' + q + (tag ? '&tag=' + tag : ''); }
  function tags(it) { return it.ImageTags || {}; }
  function posterUrl(it) {
    if (cfg.demo) return '';
    if (tags(it).Primary && it.Type !== 'Episode') return img(it.Id, 'Primary', tags(it).Primary, 'fillHeight=450&quality=90');
    if (it.SeriesId && it.SeriesPrimaryImageTag) return img(it.SeriesId, 'Primary', it.SeriesPrimaryImageTag, 'fillHeight=450&quality=90');
    if (tags(it).Primary) return img(it.Id, 'Primary', tags(it).Primary, 'fillHeight=450&quality=90');
    return '';
  }
  function wideUrl(it) {
    if (cfg.demo) return '';
    var q = 'fillWidth=576&quality=90';
    if (it.Type === 'Episode' && tags(it).Primary) return img(it.Id, 'Primary', tags(it).Primary, q);
    if (tags(it).Thumb) return img(it.Id, 'Thumb', tags(it).Thumb, q);
    if (it.ParentThumbItemId && it.ParentThumbImageTag) return img(it.ParentThumbItemId, 'Thumb', it.ParentThumbImageTag, q);
    if (it.BackdropImageTags && it.BackdropImageTags.length) return img(it.Id, 'Backdrop/0', it.BackdropImageTags[0], q);
    if (it.ParentBackdropItemId && it.ParentBackdropImageTags && it.ParentBackdropImageTags.length) return img(it.ParentBackdropItemId, 'Backdrop/0', it.ParentBackdropImageTags[0], q);
    return posterUrl(it);
  }
  function backdropUrl(it) {
    if (cfg.demo) return '';
    var q = 'maxWidth=1920&quality=85';
    if (it.BackdropImageTags && it.BackdropImageTags.length) return img(it.Id, 'Backdrop/0', it.BackdropImageTags[0], q);
    if (it.ParentBackdropItemId && it.ParentBackdropImageTags && it.ParentBackdropImageTags.length) return img(it.ParentBackdropItemId, 'Backdrop/0', it.ParentBackdropImageTags[0], q);
    return '';
  }
  function logoUrl(it) {
    if (cfg.demo) return '';
    if (tags(it).Logo) return img(it.Id, 'Logo', tags(it).Logo, 'maxWidth=700');
    if (it.ParentLogoItemId && it.ParentLogoImageTag) return img(it.ParentLogoItemId, 'Logo', it.ParentLogoImageTag, 'maxWidth=700');
    return '';
  }

  // ---------- apps ----------
  var installed = [];
  var DEMO_APPS = [{ pkg: 'demo.jellyfin', label: 'Jellyfin' }, { pkg: 'demo.yt', label: 'YouTube' }, { pkg: 'demo.music', label: 'Music' }, { pkg: 'demo.vlc', label: 'VLC' }];
  function loadInstalled() {
    if (B) { try { installed = JSON.parse(B.getApps()); } catch (e) { installed = []; } }
    else installed = cfg.demo ? DEMO_APPS : [];
  }
  function appItems() {
    if (cfg.apps == null && B) { cfg.apps = installed.filter(function (a) { return a.pkg === JELLYFIN_PKG; }).map(function (a) { return a.pkg; }); save(); }
    var list = [];
    if (!B && cfg.demo) list = DEMO_APPS.slice();
    else (cfg.apps || []).forEach(function (p) { var a = installed.find(function (x) { return x.pkg === p; }); if (a) list.push(a); });
    list.push({ special: 'settings', label: 'Home settings' });
    if (B) list.push({ special: 'firesettings', label: 'Fire TV settings' });
    return list;
  }
  var GEAR = '<svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>';
  var TV = '<svg viewBox="0 0 24 24"><path d="M21 4H3a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h7v2H7v2h10v-2h-3v-2h7a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm-1 11H4V6h16v9z"/></svg>';

  // ---------- state ----------
  var rows = [];      // [{title, kind:'apps'|'wide'|'poster', items:[]}]
  var R = 0, C = [], offs = [];
  var ov = null;

  // ---------- rendering ----------
  function ph(name, noText) { var d = el('div', 'fill ph', noText ? '' : esc(name)); d.style.background = grad(name); return d; }
  function epLabel(it) {
    var s = '';
    if (it.ParentIndexNumber != null && it.IndexNumber != null) s = 'S' + it.ParentIndexNumber + ':E' + it.IndexNumber + ' · ';
    return s + (it.Name || '');
  }
  function cardFor(row, it) {
    var c;
    if (row.kind === 'apps') {
      c = el('div', 'card app' + (it.banner ? ' banner' : ''));
      if (it.special) c.innerHTML = '<div class="appic sym">' + (it.special === 'settings' ? GEAR : TV) + '</div>';
      else if (it.icon && it.banner) c.innerHTML = '<img src="' + it.icon + '" alt="">';
      else if (it.icon) c.innerHTML = '<img class="appic" src="' + it.icon + '" alt="">';
      else { var l = el('div', 'appic letter', esc(it.label.charAt(0))); l.style.background = grad(it.label); c.appendChild(l); }
      c.appendChild(el('div', 'lbl', esc(it.label)));
      return c;
    }
    var wide = row.kind === 'wide';
    c = el('div', 'card ' + (wide ? 'wide' : 'poster'));
    var url = wide ? wideUrl(it) : posterUrl(it);
    var name = it.SeriesName || it.Name;
    if (url) {
      var im = new Image(); im.alt = '';
      im.onerror = function () { if (im.parentNode) im.parentNode.removeChild(im); c.insertBefore(ph(name, wide), c.firstChild); };
      im.src = url; c.appendChild(im);
    } else c.appendChild(ph(name, wide));
    if (wide) c.appendChild(el('div', 'cap', '<b>' + esc(name) + '</b>' + (it.Type === 'Episode' ? '<span>' + esc(epLabel(it)) + '</span>' : '')));
    var ud = it.UserData || {};
    if (ud.PlayedPercentage > 0 && ud.PlayedPercentage < 100) c.appendChild(el('div', 'bar', '<i style="width:' + ud.PlayedPercentage + '%"></i>'));
    else if (ud.Played) c.appendChild(el('div', 'check', '✓'));
    else if (it.Type === 'Series' && ud.UnplayedItemCount) c.appendChild(el('div', 'count', ud.UnplayedItemCount));
    return c;
  }
  function renderRows() {
    var inner = $('#rowsInner'); inner.innerHTML = ''; offs = [];
    rows.forEach(function (row, ri) {
      var sec = el('section', 'row');
      sec.appendChild(el('h2', null, esc(row.title)));
      var tr = el('div', 'track');
      row.items.forEach(function (it, ci) {
        var c = cardFor(row, it);
        c.onclick = function () {
          if (ov || big) return;
          var same = R === ri && C[ri] === ci;
          R = ri; C[ri] = ci; updateFocus();
          if (same) activate();
        };
        tr.appendChild(c);
      });
      sec.appendChild(tr); inner.appendChild(sec);
    });
    updateFocus();
  }
  function curItem() { var row = rows[R]; return row ? row.items[C[R] || 0] : null; }
  function updateFocus() {
    if (!rows.length) return;
    R = clamp(R, 0, rows.length - 1);
    var row = rows[R], ci = clamp(C[R] || 0, 0, row.items.length - 1); C[R] = ci;
    var secs = $('#rowsInner').children;
    for (var i = 0; i < secs.length; i++) secs[i].classList.toggle('cur', i === R);

    var movies = DEMO.names.map(function (n, i) { return demoItem(n, i, 'Movie'); });
    var shows = DEMO.shows.map(function (n, i) { return demoItem(n, i, 'Series'); });
    var eps = DEMO.shows.slice(0, 5).map(function (n, i) { var e = demoItem('Chapter ' + (i + 2), i, 'Episode'); e.Id = 'de' + i; e.SeriesName = n; e.ParentIndexNumber = 1 + i % 2; e.IndexNumber = i + 2; return e; });
    return [
      { title: 'Continue Watching', kind: 'wide', items: movies.filter(function (m) { return m.UserData.PlayedPercentage; }) },
      { title: 'Next Up', kind: 'wide', items: eps },
      { title: 'Recently Added Movies', kind: 'poster', items: movies },
      { title: 'Shows With New Episodes', kind: 'poster', items: shows }
    ];
  }
  function focusKey() { var it = curItem(); return rows[R] ? { t: rows[R].title, id: it && (it.Id || it.pkg || it.special) } : null; }
  async function refresh(resetFocus) {
    var key = resetFocus ? null : focusKey();
    var appRow = { title: 'Apps', kind: 'apps', items: appItems() }, media = [];
    if (cfg.demo) { media = demoRows(); setDot(''); }
    else if (cfg.token) {
      var defs = rowDefs(), auth = false;
      var res = await Promise.all(defs.map(function (d) {
        return apiTry(d.paths).then(norm).catch(function (e) { if (e.status === 401) auth = true; return null; });
      }));
      if (auth) { cfg.token = ''; save(); setDot('bad'); rows = [appRow]; renderRows(); welcome(); openSettings('Your sign-in expired. Please sign in again.'); return; }
      if (res.every(function (x) { return x === null; })) { setDot('bad'); toast('Can’t reach your Jellyfin server — showing apps only'); }
      else setDot('ok');
      defs.forEach(function (d, i) { if (res[i] && res[i].length) media.push({ title: d.title, kind: d.kind, items: res[i] }); });
    }
    rows = [appRow].concat(media);
    var prevHero = heroItem;
    R = media.length ? 1 : 0; C = [];
    if (key) rows.forEach(function (row, ri) {
      if (row.title !== key.t) return;
      R = ri;
      row.items.forEach(function (it, ci) { if ((it.Id || it.pkg || it.special) === key.id) C[ri] = ci; });
    });
    heroItem = null;
    renderRows();
    if (!media.length && !prevHero) welcome();
  }

  // ---------- input ----------
  function activate() {
    var row = rows[R], it = curItem(); if (!it) return;
    if (row.kind === 'apps') {
      if (it.special === 'settings') return openSettings();
      if (it.special === 'firesettings') return B && B.openSettings();
      if (B) B.launchApp(it.pkg); else toast('Demo: this would open ' + it.label);
      return;
    }
    openMenu(it);
  }
  function homeBack() {
    if ((C[R] || 0) > 0) { C[R] = 0; updateFocus(); }
    else if (R !== (rows.length > 1 ? 1 : 0)) { R = rows.length > 1 ? 1 : 0; updateFocus(); }
  }
  function handle(a) {
    if (ov) {
      if (a === 'up') ovFocus(ov.idx - 1);
      else if (a === 'down') ovFocus(ov.idx + 1);
      else if (a === 'ok') { var x = ovItems()[ov.idx]; if (x) { if (x.tagName === 'INPUT') { if (x.type === 'password') x.value = ''; x.focus(); x.click(); } else x.click(); } }
      else if (a === 'back') ov.back();
      else if ((a === 'left' || a === 'right') && ov.lr) ov.lr(a === 'left' ? -1 : 1);
      return;
    }
    if (big) {
      if (a === 'down' || a === 'back') exitBig();
      else if (a === 'left' || a === 'right') { C[R] = (C[R] || 0) + (a === 'left' ? -1 : 1); updateFocus(); }
      else if (a === 'ok') { var bi = curItem(); if (bi) openMenu(bi); }
      else if (a === 'play') togglePause();
      return;
    }
    if (!rows.length) return;
    if (a === 'left') { C[R] = (C[R] || 0) - 1; updateFocus(); }
    else if (a === 'right') { C[R] = (C[R] || 0) + 1; updateFocus(); }
    else if (a === 'up') {
      // ▲ on a title whose trailer is playing (or ready, when auto-start is off) opens the big view
      if (rows[R].kind !== 'apps' && cur && (cur.playing || (!cfg.delay && cur.ready))) enterBig();
      else { R--; updateFocus(); }
    }
    else if (a === 'down') { R++; updateFocus(); }
    else if (a === 'ok') activate();
    else if (a === 'back') homeBack();
    else if (a === 'play') { var it = curItem(); if (it && rows[R].kind !== 'apps') bigTrailer(it); }
  }
  var KEYS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down', 13: 'ok', 23: 'ok', 27: 'back', 8: 'back', 179: 'play', 85: 'play', 415: 'play', 19: 'play' };
  document.addEventListener('keydown', function (e) {
    var ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT') {          // typing in a settings field
      if (e.keyCode === 13 || e.keyCode === 40 || e.keyCode === 38 || e.keyCode === 27) {
        e.preventDefault(); ae.blur();
        if (e.keyCode === 13 || e.keyCode === 40) ovFocus(ov.idx + 1);
        else if (e.keyCode === 38) ovFocus(ov.idx - 1);
      }
      return;
    }
    var a = KEYS[e.keyCode]; if (!a) return;
    e.preventDefault(); handle(a);
  });

  // ---------- hooks called by the Android app ----------
  window.jhBack = function () {
    var ae = document.activeElement;
    if (ae && ae.tagName === 'INPUT') { ae.blur(); return; }
    handle('back');
  };
  window.jhPause = function () { exitBig(); stopTrailer(); };
  window.jhResume = function () {
    loadInstalled();
    if (ov) return;
    if (cfg.token || cfg.demo) refresh(); else rebuildApps();
  };

  // ---------- boot ----------
  window.jhFit = fit;
  window.addEventListener('resize', fit); window.addEventListener('load', fit); fit();
  [100, 400, 1000, 2500].forEach(function (ms) { setTimeout(fit, ms); });
  clock(); setInterval(clock, 10000);
  loadInstalled();
  if (cfg.token || cfg.demo) refresh(true);
  else { rows = [{ title: 'Apps', kind: 'apps', items: appItems() }]; renderRows(); welcome(); openSettings(); }
  setInterval(function () { if (!ov && !big && cfg.token && !$('#stage').classList.contains('trailer-on')) refresh(); }, 15 * 60 * 1000);
})();
</script>
